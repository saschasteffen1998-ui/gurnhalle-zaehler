<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Personenzähler Gurnhalle</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #111; color: #fff; font-family: system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
  #view { flex: 1; position: relative; min-height: 0; }
  #canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
  #video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  #panel { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  #counts { display: flex; gap: 8px; }
  .box { flex: 1; background: #222; border-radius: 10px; padding: 8px; text-align: center; font-size: .9rem; }
  .box b { display: block; font-size: 2rem; }
  .row { display: flex; gap: 8px; align-items: center; }
  button { flex: 1; font-size: 1rem; padding: 12px; border: 0; border-radius: 10px; color: #fff; background: #444; }
  #start { background: #2e7d32; }
  input[type=range] { flex: 2; }
  #status { font-size: .85rem; opacity: .8; min-height: 1.2em; }
</style>
</head>
<body>
<div id="view">
  <video id="video" playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>
<div id="panel">
  <div id="counts">
    <div class="box">Rein<b id="inCount">0</b></div>
    <div class="box">Raus<b id="outCount">0</b></div>
    <div class="box">Drin (ca.)<b id="inside">0</b></div>
  </div>
  <div class="row">
    <span>Linie</span>
    <input type="range" id="line" min="10" max="90" value="50">
  </div>
  <div class="row">
    <button id="start" disabled>Lade Modell…</button>
    <button id="flip">Richtung tauschen</button>
    <button id="reset">Reset</button>
  </div>
  <div id="status"></div>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);
const startBtn = $('start');
const statusEl = $('status');
const lineSlider = $('line');

let model = null;
let running = false;
let session = 0;
let tracks = [];
let nextId = 1;
let inCount = 0;
let outCount = 0;
let reverse = false;

const MARGIN = 0.03;    // Hysterese (Anteil der Bildhöhe), verhindert Doppelzählung bei Zittern an der Linie
const MAX_MISSED = 8;   // Frames ohne Erkennung, bevor eine Person vergessen wird
const MAX_MOVE = 0.12;  // max. Bewegung zwischen zwei Frames (Anteil der Bildbreite)

function setStatus(t) { statusEl.textContent = t; }

function updateCounters() {
  $('inCount').textContent = inCount;
  $('outCount').textContent = outCount;
  $('inside').textContent = Math.max(0, inCount - outCount);
}

async function init() {
  try {
    setStatus('Lade KI-Modell (einmalig, ca. 10 MB)…');
    model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
    setStatus('Modell bereit.');
    startBtn.disabled = false;
    startBtn.textContent = 'Start';
  } catch (e) {
    setStatus('Modell konnte nicht geladen werden: ' + e.message);
  }
}

async function start() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    running = true;
    startBtn.textContent = 'Stop';
    setStatus('Läuft…');
    loop(++session);
  } catch (e) {
    setStatus('Kamera-Fehler: ' + e.message + ' (Die Seite muss über https laufen.)');
  }
}

function stop() {
  running = false;
  startBtn.textContent = 'Start';
  if (video.srcObject) {
    video.srcObject.getTracks().forEach(t => t.stop());
    video.srcObject = null;
  }
  setStatus('Gestoppt.');
}

async function loop(my) {
  if (!running || my !== session) return;

  const preds = await model.detect(video, 30, 0.5);
  const people = preds.filter(p => p.class === 'person');

  const W = canvas.width, H = canvas.height;
  const lineY = H * lineSlider.value / 100;

  ctx.drawImage(video, 0, 0, W, H);
  updateTracks(people, W, H, lineY);
  drawOverlay(W, H, lineY);
  updateCounters();

  requestAnimationFrame(() => loop(my));
}

function updateTracks(dets, W, H, lineY) {
  const ds = dets.map(d => {
    const [x, y, w, h] = d.bbox;
    return { cx: x + w / 2, cy: y + h / 2, bbox: d.bbox, used: false };
  });
  const maxMove = W * MAX_MOVE;
  const margin = H * MARGIN;

  // Bestehende Personen mit der nächsten Erkennung verknüpfen
  for (const t of tracks) {
    let best = null;
    let bestDist = maxMove;
    for (const d of ds) {
      if (d.used) continue;
      const dist = Math.hypot(d.cx - t.cx, d.cy - t.cy);
      if (dist < bestDist) { bestDist = dist; best = d; }
    }
    if (best) {
      best.used = true;
      t.cx = best.cx;
      t.cy = best.cy;
      t.bbox = best.bbox;
      t.missed = 0;

      // Seite der Linie mit Hysterese bestimmen (0 = oben, 1 = unten)
      let side = t.side;
      if (side === 0 && t.cy > lineY + margin) side = 1;
      else if (side === 1 && t.cy < lineY - margin) side = 0;

      if (side !== t.side) {
        const movedDown = side === 1;
        if (movedDown !== reverse) inCount++;  // Standard: von oben nach unten = rein
        else outCount++;
        t.side = side;
      }
    } else {
      t.missed++;
    }
  }

  // Neu erkannte Personen anlegen (ohne Zählung, nur Startseite merken)
  for (const d of ds) {
    if (!d.used) {
      tracks.push({
        id: nextId++,
        cx: d.cx, cy: d.cy, bbox: d.bbox,
        side: d.cy < lineY ? 0 : 1,
        missed: 0
      });
    }
  }

  tracks = tracks.filter(t => t.missed <= MAX_MISSED);
}

function drawOverlay(W, H, lineY) {
  // Zählerlinie
  ctx.lineWidth = Math.max(3, W / 250);
  ctx.strokeStyle = '#00ff66';
  ctx.beginPath();
  ctx.moveTo(0, lineY);
  ctx.lineTo(W, lineY);
  ctx.stroke();

  ctx.font = `${Math.round(W / 35)}px sans-serif`;
  ctx.fillStyle = '#00ff66';
  ctx.fillText(reverse ? '↑ rein  |  ↓ raus' : '↓ rein  |  ↑ raus', 10, lineY - 10);

  // Erkannte Personen
  ctx.lineWidth = Math.max(2, W / 400);
  for (const t of tracks) {
    if (t.missed > 0) continue;
    const [x, y, w, h] = t.bbox;
    ctx.strokeStyle = t.side === 1 ? '#ffcc00' : '#ff5555';
    ctx.strokeRect(x, y, w, h);
  }
}

startBtn.addEventListener('click', () => (running ? stop() : start()));
$('flip').addEventListener('click', () => { reverse = !reverse; });
$('reset').addEventListener('click', () => {
  inCount = 0;
  outCount = 0;
  tracks = [];
  updateCounters();
});

init();
</script>
</body>
</html>
